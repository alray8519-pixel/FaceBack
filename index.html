<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faceback - تطبيق المراسلة</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">

  <!-- شاشة تسجيل الدخول -->
  <div id="authScreen" class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <h1 class="logo-text">Faceback</h1>
        <p>تطبيق المراسلة الفورية العصري</p>
      </div>
      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchAuthTab('login')">تسجيل الدخول</button>
        <button class="tab-btn" onclick="switchAuthTab('signup')">حساب جديد</button>
      </div>
      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="input-group" id="nameGroup" style="display: none;">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="authName" placeholder="الاسم الكامل">
        </div>
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="authEmail" required placeholder="البريد الإلكتروني">
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="authPassword" required placeholder="كلمة المرور">
        </div>
        <button type="submit" class="primary-btn" id="authSubmitBtn">تسجيل الدخول</button>
      </form>
    </div>
  </div>

  <!-- الواجهة الرئيسية للتطبيق -->
  <div id="appScreen" class="app-container" style="display: none;">
    <!-- الشريط الجانبي / القائمة الرئيسية -->
    <aside class="sidebar">
      <header class="app-header">
        <div class="header-brand">
          <h1 class="logo-text">Faceback</h1>
        </div>
        <div class="user-mini-profile" onclick="switchTab('profile')">
          <img id="myAvatar" src="https://via.placeholder.com/40" alt="صورة البروفايل">
        </div>
      </header>

      <!-- كود المستخدم -->
      <div class="user-code-banner">
        <span>كودك الخاص: <strong id="myCode">----</strong></span>
        <button onclick="copyCode()" class="icon-btn-sm" title="نسخ الكود"><i class="fa-regular fa-copy"></i></button>
      </div>

      <!-- التنقل بين الأقسام -->
      <nav class="nav-tabs">
        <button class="nav-btn active" id="btnChats" onclick="switchTab('chats')"><i class="fa-solid fa-comment-dots"></i> المحادثات</button>
        <button class="nav-btn" id="btnFriends" onclick="switchTab('friends')"><i class="fa-solid fa-user-plus"></i> الأصدقاء</button>
        <button class="nav-btn" id="btnProfile" onclick="switchTab('profile')"><i class="fa-solid fa-user"></i> الملف</button>
        <button class="nav-btn" id="btnSettings" onclick="switchTab('settings')"><i class="fa-solid fa-gear"></i> الإعدادات</button>
      </nav>

      <!-- تبويب المحادثات -->
      <section id="chatsTab" class="tab-content active">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="chatSearchInput" placeholder="بحث في المحادثات..." oninput="filterChats()">
        </div>
        <div class="chats-list" id="chatsList">
          <!-- تضاف المحادثات هنا ديناميكياً -->
        </div>
      </section>

      <!-- تبويب الأصدقاء والبحث -->
      <section id="friendsTab" class="tab-content" style="display: none;">
        <div class="add-friend-card">
          <h3>إضافة صديق بالكود</h3>
          <div class="input-with-btn">
            <input type="text" id="friendCodeInput" placeholder="أدخل كود الصديق (4 أرقام)" maxlength="4">
            <button onclick="searchAndAddFriend()"><i class="fa-solid fa-user-plus"></i> إضافة</button>
          </div>
        </div>
        <div class="friends-list" id="friendsList">
          <!-- قائمة الأصدقاء -->
        </div>
      </section>

      <!-- تبويب الملف الشخصي -->
      <section id="profileTab" class="tab-content" style="display: none;">
        <div class="profile-card">
          <div class="avatar-upload-container">
            <img id="profileImage" src="https://via.placeholder.com/100" alt="صورة الملف الشخصي">
            <label for="avatarInput" class="avatar-edit-btn"><i class="fa-solid fa-camera"></i></label>
            <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar(event)" style="display:none;">
          </div>
          <div class="profile-inputs">
            <label>اسم المستخدم</label>
            <input type="text" id="profileNameInput" placeholder="الاسم الظاهر">
            <label>البريد الإلكتروني</label>
            <input type="email" id="profileEmailInput" disabled>
            <label>كود الحساب</label>
            <input type="text" id="profileCodeInput" disabled>
            <button class="primary-btn" onclick="saveProfile()">حفظ التغيرات</button>
          </div>
        </div>
      </section>

      <!-- تبويب الإعدادات -->
      <section id="settingsTab" class="tab-content" style="display: none;">
        <div class="settings-list">
          <div class="setting-item">
            <span><i class="fa-solid fa-moon"></i> الوضع الداكن</span>
            <label class="switch">
              <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
              <span class="slider round"></span>
            </label>
          </div>
          <div class="setting-item">
            <span><i class="fa-solid fa-bell"></i> الإشعارات</span>
            <label class="switch">
              <input type="checkbox" checked>
              <span class="slider round"></span>
            </label>
          </div>
          <div class="setting-item">
            <span><i class="fa-solid fa-language"></i> اللغة</span>
            <select id="langSelect"><option value="ar">العربية</option><option value="en">English</option></select>
          </div>
          <button class="danger-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
        </div>
      </section>
    </aside>

    <!-- منطقة المحادثة النشطة -->
    <main class="chat-area">
      <div id="noChatSelected" class="empty-chat">
        <i class="fa-solid fa-comments"></i>
        <h3>اختر محادثة لبدء المراسلة</h3>
        <p>يمكنك البحث عن الأصدقاء باستخدام الكود الخاص بهم</p>
      </div>

      <div id="activeChat" class="active-chat-container" style="display: none;">
        <!-- هيدر الشات -->
        <header class="chat-header">
          <div class="chat-user-info">
            <button class="back-btn" onclick="closeChat()"><i class="fa-solid fa-arrow-right"></i></button>
            <img id="activeChatAvatar" src="https://via.placeholder.com/40" alt="صورة المستلم">
            <div>
              <h4 id="activeChatName">اسم المستلم</h4>
              <span class="status-online"><i class="fa-solid fa-circle"></i> متصل الآن</span>
            </div>
          </div>
          <div class="chat-actions">
            <button onclick="startCall('audio')" title="مكالمة صوتية"><i class="fa-solid fa-phone"></i></button>
            <button onclick="startCall('video')" title="مكالمة فيديو"><i class="fa-solid fa-video"></i></button>
            <button onclick="openBgModal()" title="تغيير خلفية الشات"><i class="fa-solid fa-image"></i></button>
          </div>
        </header>

        <!-- منطقة الرسائل -->
        <div class="messages-container" id="messagesContainer">
          <!-- الرسائل تظهر هنا -->
        </div>

        <!-- أداة إدخال الرسائل -->
        <footer class="chat-input-bar">
          <label for="fileAttachment" class="attach-btn" title="إرفاق ملف"><i class="fa-solid fa-paperclip"></i></label>
          <input type="file" id="fileAttachment" style="display:none;" onchange="handleFileUpload(event)">
          
          <label for="imageAttachment" class="attach-btn" title="إرفاق صورة"><i class="fa-solid fa-camera"></i></label>
          <input type="file" id="imageAttachment" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">

          <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
          
          <button id="micBtn" class="record-btn" onclick="toggleRecording()"><i class="fa-solid fa-microphone"></i></button>
          <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </footer>
      </div>
    </main>
  </div>

  <!-- نافذة تغيير خلفية المحادثة -->
  <div id="bgModal" class="modal">
    <div class="modal-content">
      <h3>اختيار خلفية المحادثة</h3>
      <div class="bg-options">
        <button onclick="setChatBg('default')" class="bg-opt">الافتراضية</button>
        <button onclick="setChatBg('preset-1')" class="bg-opt bg-p1">خلفية 1</button>
        <button onclick="setChatBg('preset-2')" class="bg-opt bg-p2">خلفية 2</button>
        <label class="primary-btn modal-upload-btn">
          رفع من الجهاز <input type="file" accept="image/*" onchange="uploadCustomBg(event)" style="display:none;">
        </label>
      </div>
      <button class="close-btn" onclick="closeBgModal()">إغلاق</button>
    </div>
  </div>

  <!-- نافذة المكالمات الصوتية والمرئية -->
  <div id="callModal" class="modal">
    <div class="modal-content call-box">
      <div class="call-avatar-container">
        <img id="callAvatar" src="https://via.placeholder.com/80" alt="صورة المتصل">
      </div>
      <h3 id="callTargetName">اسم المتصل</h3>
      <p id="callStatusText">جاري الاتصال...</p>
      <div id="videoContainer" class="video-preview" style="display:none;">
        <i class="fa-solid fa-video placeholder-icon"></i>
      </div>
      <div class="call-controls">
        <button class="call-btn btn-mute"><i class="fa-solid fa-microphone-slash"></i></button>
        <button class="call-btn btn-hangup" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
